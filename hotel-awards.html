<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Award Radar</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0f14; color: #d7dde5; font: 14px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  header { padding: 18px 22px 10px; border-bottom: 1px solid #1d2733; }
  h1 { font-size: 16px; margin: 0 0 4px; letter-spacing: 2px; color: #7fd1b9; }
  .sub { color: #6b7a8c; font-size: 12px; max-width: 900px; }
  a.back { color: #7fd1b9; font-size: 12px; text-decoration: none; }
  main { padding: 14px 22px 40px; max-width: 1040px; }
  .form { border: 1px solid #1d2733; border-radius: 8px; padding: 12px 14px; background: #0f1520;
          display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 14px; }
  .form label { color: #6b7a8c; font-size: 12px; margin-right: 4px; }
  .form select, .form input { background: #131b27; border: 1px solid #314052; color: #d7dde5;
          border-radius: 6px; padding: 4px 8px; font: inherit; }
  .form input { width: 200px; }
  .count { color: #8fa1b5; font-size: 12px; margin: 4px 0 10px; }
  .card { border: 1px solid #1d2733; border-radius: 10px; padding: 12px 15px 10px; margin: 0 0 11px; background: #0f1520; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
  .title { font-size: 15px; color: #eef3f8; font-weight: 700; }
  .kind { font-size: 10px; letter-spacing: 1px; padding: 2px 8px; border-radius: 9px; border: 1px solid #314052; color: #8fa1b5; }
  .kind.roame { border-color: #6b5327; color: #ffd479; }
  .kind.gondola { border-color: #2c5d4b; color: #7fd1b9; }
  .points { font-size: 19px; color: #ffd479; white-space: nowrap; text-align: right; }
  .per { font-size: 11px; color: #6b7a8c; }
  .line { color: #9fb0c0; font-size: 13px; margin-top: 2px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; border: 1px solid #314052; color: #8fa1b5; }
  .tag.warn { border-color: #6b5327; color: #ffd479; }
  .perk { letter-spacing: 0.5px; font-weight: 700; }
  .perk.ok { border-color: #2c5d4b; color: #7fd1b9; }
  .perk.buy { border-color: #6b5327; color: #ffd479; }
  .perk.req { border-color: #3a4656; color: #8fa1b5; border-style: dashed; }
  .bounded { color: #8fa1b5; font-size: 11.5px; margin-top: 6px; font-style: italic; }
  .meta { color: #55636f; font-size: 11.5px; margin-top: 5px; }
  .btn { font-size: 12px; padding: 4px 12px; border-radius: 6px; border: 1px solid #314052;
         color: #d7dde5; background: #131b27; text-decoration: none; }
  .empty { color: #6b7a8c; padding: 24px 0; font-size: 13px; }
  .panel { border: 1px solid #1d2733; border-radius: 10px; padding: 12px 15px; margin: 0 0 14px; background: #0d131c; }
  .panel-title { font-size: 11px; letter-spacing: 1.5px; color: #8fa1b5; margin-bottom: 8px; }
  .ck { font-size: 12px; color: #c6d0da; margin-right: 8px; white-space: nowrap; }
  .ck input { vertical-align: -2px; }
  button.btn { cursor: pointer; }
  button.btn.run { border-color: #6b5327; color: #ffd479; }
  button.btn[disabled] { opacity: 0.5; cursor: default; }
  .err { color: #ff9d9d; font-size: 12px; margin-top: 8px; }
  .plan { margin-top: 10px; }
  .plan .tag { margin: 2px 4px 2px 0; display: inline-block; }
</style>
</head>
<body>
<header>
  <h1>HOTEL AWARD RADAR</h1>
  <div class="sub" id="disclaimer">loading…</div>
  <div style="margin-top:6px"><a class="back" href="/observer.html">← Observer</a> · <a class="back" href="/">Search dashboard</a></div>
</header>
<main>
  <div class="panel" id="discovery">
    <div class="panel-title">LONG-STAY DISCOVERY — sparse exact Roame windows (no search runs without your click)</div>
    <div class="form">
      <span><label>Destination</label><input id="d-location" value="Bangkok"></span>
      <span><label>Check-in</label><input id="d-in" value="2026-11-01" style="width:110px"></span>
      <span><label>Check-out</label><input id="d-out" value="2026-12-01" style="width:110px"></span>
      <span><label>Candidate stays</label>
        <label class="ck"><input type="checkbox" class="d-n" value="2" checked>2 nights</label>
        <label class="ck"><input type="checkbox" class="d-n" value="4" checked>4 nights</label>
        <label class="ck"><input type="checkbox" class="d-n" value="5" checked>5 nights</label>
        <label class="ck"><input type="checkbox" class="d-n" value="7" checked>7 nights</label>
      </span>
      <span><label>Max windows</label><input id="d-max" value="8" style="width:52px"></span>
      <button class="btn" id="d-preview" type="button">Preview plan</button>
      <button class="btn run" id="d-run" type="button">Run discovery</button>
    </div>
    <div id="d-plan"></div>
    <div id="d-status"></div>
  </div>
  <div class="form" id="form">
    <span><label>Program</label><select id="program"><option value="">All programs</option></select></span>
    <span><label>Provider</label><select id="provider"><option value="">All</option></select></span>
    <span><label>Property</label><input id="q" placeholder="text search"></span>
  </div>
  <div class="count" id="count"></div>
  <div id="results"><div class="empty">loading award-stay observations…</div></div>
</main>
<script>
const fmt = new Intl.NumberFormat("en-US")
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]))
const money = (a, c) => (c === "USD" ? "$" : c === "EUR" ? "€" : (c ? c + " " : "")) + fmt.format(Math.round(a))
const PROG = { WORLD_OF_HYATT: "World of Hyatt", HILTON_HONORS: "Hilton Honors", MARRIOTT_BONVOY: "Marriott Bonvoy",
  IHG_ONE_REWARDS: "IHG One Rewards", ACCOR_ALL: "Accor ALL", WYNDHAM_REWARDS: "Wyndham Rewards",
  CHOICE_PRIVILEGES: "Choice Privileges" }
const prog = p => PROG[p] || p
const provLabel = p => p === "roame_hotels" ? "Roame" : p === "gondola_hotels" ? "Gondola" : p

let ALL = []

function action(o) {
  const n = o.navigation
  if (!n || !n.url || n.quality === "UNAVAILABLE")
    return `<span class="meta">no trustworthy link</span>`
  const label = n.quality === "EXACT_DEEP_LINK" ? "Check & book at provider"
    : n.quality === "SEARCH_REPLAY_LINK" ? "Open provider search" : "Open provider page"
  return `<a class="btn" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${label}</a>`
}

// Verified perk badges — display only. Eligibility is DECLARED config, never
// inferred; nothing here ranks, values or synthesizes a number.
function perkBadges(o) {
  return (o.perks || []).map(p => {
    const cls = p.eligibility === "eligible" ? "ok" : p.eligibility === "purchasable" ? "buy" : "req"
    const suffix = p.eligibility === "eligible" ? ""
      : p.eligibility === "purchasable"
        ? (p.acquisition && p.acquisition.cost && p.acquisition.cost.amount > 0
            ? " · join " + money(p.acquisition.cost.amount, p.acquisition.cost.currency) + "/yr"
            : " · join free")
        : " · needs status/card"
    const rateMark = p.appliesTo === "cash" ? " (cash rates only)" : ""
    // Only a source_page rule may present itself as verified; anything else
    // is marked unverified and can never read as an optimizer-grade perk.
    const verified = p.verification === "source_page"
    const trust = verified
      ? " Source-verified " + p.verifiedAt + "."
      : " UNVERIFIED — encoded from program knowledge, not checked against the official source; re-verify before relying on it."
    const tip = p.displayBenefit
      + (p.bookingChannel ? " — " + p.bookingChannel : "")
      + " Requires: " + p.requires.join(" or ") + "."
      + trust
    const unvMark = verified ? "" : " · unverified"
    return `<span class="tag perk ${verified ? cls : "req"}" title="${esc(tip)}">${esc(p.badgeLabel)}${esc(rateMark)}${esc(suffix)}${esc(unvMark)}</span>`
  }).join("")
}

function card(o) {
  // Points are PER-NIGHT as stored — never a synthesized stay total.
  const pts = o.pointsPerNight != null ? `${fmt.format(o.pointsPerNight)}<span class="per"> pts/night</span>`
    : (o.quoteBasis === "full_stay" && o.pointsTotal != null ? `${fmt.format(o.pointsTotal)}<span class="per"> pts total (stated)</span>` : "—")
  const room = o.roomName ? `${esc(o.roomName)}${o.roomClass ? " · " + esc(o.roomClass) : ""}`
    : (o.roomClass ? esc(o.roomClass) : "room not stated")
  const taxes = o.taxesFeesState === "stated" && o.taxesFeesAmount != null
    ? `taxes/fees ${money(o.taxesFeesAmount, o.taxesFeesCurrency)}`
    : `taxes/fees ${esc(o.taxesFeesState)}`
  const cash = o.cashComparisonAmount != null
    ? `<span class="tag">cash context ${money(o.cashComparisonAmount, o.cashComparisonCurrency)} — not a comparison</span>` : ""
  const fresh = o.sourceFreshness ? `source freshness ${esc(String(o.sourceFreshness).slice(0, 16))}` : "source freshness unknown"
  const bounded = o.availabilityState === "unknown"
    ? `<div class="bounded">Historical/period award observation — not a live hold.</div>` : ""
  return `<div class="card">
    <div class="top">
      <div>
        <span class="kind ${o.provider === 'roame_hotels' ? 'roame' : 'gondola'}">${esc(provLabel(o.provider))}</span>
        <div class="title">${esc(o.propertyName)}</div>
        <div class="line">${esc(prog(o.program))} · ${esc(o.checkIn)} → ${esc(o.checkOut)} · ${o.nights} night${o.nights === 1 ? "" : "s"} · ${room}</div>
      </div>
      <div><div class="points">${pts}</div><div class="per">${esc(o.quoteBasis.replace("_", " "))}</div></div>
    </div>
    <div class="tags">
      ${perkBadges(o)}
      <span class="tag ${o.taxesFeesState === "stated" ? "" : "warn"}">${taxes}</span>
      ${cash}
      <span class="tag">availability ${esc(o.availabilityState)}</span>
      <span class="tag">search ${esc(o.searchState)}</span>
      ${action(o)}
    </div>
    ${bounded}
    <div class="meta">${fresh} · observed ${esc(String(o.fetchedAt).slice(0, 16))} · ${esc(o.verificationLevel)}</div>
  </div>`
}

function apply() {
  const pv = document.getElementById("provider").value
  const q = document.getElementById("q").value.trim().toLowerCase()
  let rows = ALL
  if (pv) rows = rows.filter(o => o.provider === pv)
  if (q) rows = rows.filter(o => (o.propertyName || "").toLowerCase().includes(q))
  document.getElementById("count").textContent = `${rows.length} observation${rows.length === 1 ? "" : "s"} (newest first)`
  document.getElementById("results").innerHTML = rows.length
    ? rows.map(card).join("")
    : '<div class="empty">No award-stay observations match — run npm run hotel-awards:probe.</div>'
}

async function load() {
  const program = document.getElementById("program").value
  const res = await fetch("/api/hotel-awards?limit=300" + (program ? "&program=" + encodeURIComponent(program) : ""))
  const data = await res.json()
  document.getElementById("disclaimer").textContent = data.disclaimer || ""
  // Populate program/provider filters once (from the full set).
  const progSel = document.getElementById("program")
  if (progSel.options.length === 1) for (const p of data.programs || []) progSel.add(new Option(prog(p), p))
  const provSel = document.getElementById("provider")
  if (provSel.options.length === 1) for (const p of data.providers || []) provSel.add(new Option(provLabel(p), p))
  ALL = data.observations || []
  apply()
}

// ── Long-stay discovery panel ────────────────────────────────────────────────
// Preview is READ-ONLY (zero provider calls); discovery runs ONLY on the
// explicit Run click — nothing on this page searches automatically.

// Known hotel regions by destination airport — presentation data for the
// flight-dashboard hand-off. An unmapped IATA passes through verbatim and the
// provider answers honestly (structured unconfigured, never a guessed box).
const IATA_LOCATIONS = { BKK: "Bangkok", DMK: "Bangkok" }
let tripAdults = null

// Trip hand-off from the flight dashboard (?dest&checkIn&checkOut&adults):
// PREFILL ONLY. Nothing searches without an explicit click, and a one-way
// hand-off (no checkOut) clears the check-out field instead of inventing one.
function prefillFromTrip() {
  const q = new URLSearchParams(location.search)
  const dest = q.get("dest")
  const loc = q.get("location")
  if (loc) document.getElementById("d-location").value = loc
  else if (dest) document.getElementById("d-location").value = IATA_LOCATIONS[dest.toUpperCase()] || dest.toUpperCase()
  const checkIn = q.get("checkIn")
  const checkOut = q.get("checkOut")
  if (checkIn) {
    document.getElementById("d-in").value = checkIn
    document.getElementById("d-out").value = checkOut ?? ""
    if (!checkOut) {
      document.getElementById("d-plan").innerHTML =
        '<div class="meta">One-way flight hand-off — enter your own check-out date, then preview. No date was invented for you.</div>'
    }
  }
  const adults = q.get("adults")
  if (adults && Number.isInteger(Number(adults)) && Number(adults) >= 1) tripAdults = Number(adults)
}
prefillFromTrip()

function discoveryParams() {
  const nights = [...document.querySelectorAll(".d-n")].filter(c => c.checked).map(c => c.value)
  const p = new URLSearchParams({
    location: document.getElementById("d-location").value.trim(),
    checkIn: document.getElementById("d-in").value.trim(),
    checkOut: document.getElementById("d-out").value.trim(),
  })
  if (nights.length) p.set("nights", nights.join(","))
  const max = document.getElementById("d-max").value.trim()
  if (max) p.set("maxWindows", max)
  if (tripAdults !== null) p.set("adults", String(tripAdults))
  return p
}

// Both actions refuse a missing check-out up front with the honest reason.
function checkOutMissing(el) {
  if (document.getElementById("d-out").value.trim()) return false
  el.innerHTML = '<div class="err">check-out is required — a one-way flight hand-off does not invent one; pick your own date</div>'
  return true
}

async function previewPlan() {
  const box = document.getElementById("d-plan")
  if (checkOutMissing(box)) return
  box.innerHTML = '<div class="meta">planning… (read-only — zero provider calls)</div>'
  try {
    const res = await fetch("/api/hotel-awards/plan?" + discoveryParams())
    const data = await res.json()
    if (!res.ok) { box.innerHTML = `<div class="err">${esc(data.error || "plan failed")}</div>`; return }
    const p = data.plan
    box.innerHTML = `<div class="plan">
      <div class="meta">Requested ${esc(p.rangeStart)} → ${esc(p.rangeEnd)} (${p.totalNights} nights) ·
        candidate windows before budget: ${data.candidatesBeforeBudget} · selected: ${p.windows.length} ·
        dropped: ${p.dropped.length} · budget ${p.budget} · at most ${data.maxHttpCalls} Roame HTTP calls
        (${data.maxPagesPerWindow} page(s)/window) · this preview spent zero provider calls</div>
      <div>${p.windows.map(w => `<span class="tag">${esc(w.checkIn)} → ${esc(w.checkOut)} · ${w.nights}n · ${esc(w.anchor)}</span>`).join("")}</div>
      ${p.dropped.length ? `<div class="meta">dropped over budget (deterministic): ${p.dropped.map(w => `${esc(w.checkIn)} ${w.nights}n`).join(", ")}</div>` : ""}
    </div>`
  } catch (err) {
    box.innerHTML = `<div class="err">plan failed: ${esc(err.message)}</div>`
  }
}

async function runDiscovery() {
  const btn = document.getElementById("d-run")
  const status = document.getElementById("d-status")
  if (checkOutMissing(status)) return
  btn.disabled = true
  status.innerHTML = '<div class="meta">running discovery — executing planned exact Roame windows…</div>'
  try {
    const res = await fetch("/api/hotel-awards/discover?" + discoveryParams(), { method: "POST" })
    const data = await res.json()
    if (!res.ok) { status.innerHTML = `<div class="err">${esc(data.error || "discovery failed")}</div>`; return }
    const s = data.summary
    const oddStates = s.results.filter(r => r.searchState !== "complete")
    status.innerHTML = `<div class="plan">
      <div class="meta">windows ${s.windowsCompleted}/${s.windowsPlanned} · provider calls ${s.providerCalls} ·
        observations stored ${s.observationsStored} · distinct hotels ${s.distinctHotels} ·
        programs: ${s.programs.map(p => esc(prog(p))).join(", ") || "—"}</div>
      ${s.stoppedOnBlock ? '<div class="err">BLOCKED — the run stopped early; no retries were attempted.</div>' : ""}
      ${oddStates.length ? `<div class="meta">non-complete windows: ${oddStates.map(r =>
        `${esc(r.window.checkIn)} ${r.window.nights}n — ${esc(r.searchState)}${r.error ? " (" + esc(r.error) + ")" : ""}`).join("; ")}</div>` : ""}
    </div>`
    await load()   // the stored observations render through the existing cards + filters
  } catch (err) {
    status.innerHTML = `<div class="err">discovery failed: ${esc(err.message)}</div>`
  } finally {
    btn.disabled = false
  }
}

document.getElementById("d-preview").addEventListener("click", previewPlan)
document.getElementById("d-run").addEventListener("click", runDiscovery)

document.getElementById("program").addEventListener("change", load)
document.getElementById("provider").addEventListener("change", apply)
document.getElementById("q").addEventListener("input", apply)
load().catch(err => { document.getElementById("results").innerHTML = '<div class="empty">failed to load: ' + esc(err.message) + "</div>" })
</script>
</body>
</html>
